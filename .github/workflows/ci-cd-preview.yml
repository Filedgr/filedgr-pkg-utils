on:
  push:
    branches-ignore:
      - main
env:
  AWS_ACCESS_KEY_ID: ${{ secrets.awsAccessKeyIdDev }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.awsSecretAccessKeyDev }}
jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      - name: Linting
        run: |
          pip install flake8
          flake8 src
      - name: Test with Coverage
        run: |
          pip install -r requirements-test.txt
          pytest tests --cov=src/{{cookiecutter.package_name}} --cov-fail-under=30 --cov-report term-missing
  cd:
    needs: ci
    name: Continuous Deployment
    runs-on: ubuntu-22.04
    if: ${{ contains(github.event.head_commit.message, '#publish') }}
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Login in twine to Code Artifact
        run: |
          aws codeartifact login --tool twine --repository filedgr-pkg-awsutils --domain filedgr --domain-owner 867912683733 --region eu-central-1
      - name: Building the package
        run: |
          make package
      - name: Upload the package
        run: |
          make upload-package
