name: CD - Version & Publish

# Tag-based releases: nothing is committed to the repository. The released
# commit is tagged vX.Y.Z and the package version is taken from that tag at
# build time (setuptools-scm). This keeps main changeable only through reviewed
# pull requests, as its branch rules require.

on:
  push:
    branches:
      - main
      - 'feature/*'
      - 'bugfix/*'

permissions:
  contents: write # Needed to push the release tag

jobs:
  release:
    name: Tag and Publish
    runs-on: ubuntu-22.04
    # ONLY run if the commit message contains a release keyword
    if: |
      contains(github.event.head_commit.message, '#patch') ||
      contains(github.event.head_commit.message, '#minor') ||
      contains(github.event.head_commit.message, '#major') ||
      contains(github.event.head_commit.message, '#alpha') ||
      contains(github.event.head_commit.message, '#final')
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Full history and tags: needed to find the latest release and by setuptools-scm
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # Rules (see scripts/next_version.py): #alpha on any branch; #patch,
      # #minor, #major and #final only on main. A re-run reuses the tag
      # already on this commit instead of bumping again.
      - name: Determine Version
        id: version
        env:
          # Passed via env, never pasted into the script: commit messages are untrusted input
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          BRANCH: ${{ github.ref_name }}
        run: python scripts/next_version.py >> "$GITHUB_OUTPUT"

      - name: Run Tests
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
          make test-coverage

      - name: Tag Release Commit
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "Tag v$VERSION already exists (re-run); reusing it."
          else
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                tag -a "v$VERSION" -m "Release $VERSION"
          fi

      - name: Build Package (sdist and wheel)
        run: |
          pip install build twine
          python -m build

      - name: Check Package Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          twine check dist/*
          # setuptools-scm must have picked up the tag exactly (no dev/local suffix)
          ls dist/
          test -f "dist/filedgr_pkg_utils-$VERSION-py3-none-any.whl"
          test -f "dist/filedgr_pkg_utils-$VERSION.tar.gz"

      # Pushed before publishing so a failed publish can be re-run with the same version.
      - name: Push Release Tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "Tag v$VERSION is already on GitHub."
          else
            git push origin "refs/tags/v$VERSION"
          fi

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_TOKEN }}
          skip-existing: true
