name: CI - Checks & Tests

on:
  pull_request:
    branches:
      - main

# Read-only: this workflow must never push to the PR branch. A commit pushed by
# the workflow token starts no workflows, so it would become a PR head commit
# that required checks (iso-compliance) never report on, blocking the merge.
# The coverage badge is regenerated by the release workflow on main instead.
permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        # Default ref for pull_request = the PR merged into main, i.e. what will be merged
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Static Code Analysis (Lint)
        run: make lint

      - name: Run Tests with Coverage
        run: make test-coverage
