name: CD - Version & Publish

on:
  push:
    branches:
      - main
      - 'feature/*'
      - 'bugfix/*'

permissions:
  contents: write # Needed to push the version bump commit back to the repo

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.awsAccessKeyIdDev }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.awsSecretAccessKeyDev }}

jobs:
  release:
    name: Bump Version and Publish
    runs-on: ubuntu-22.04
    # ONLY run if the commit message contains a release keyword
    if: |
      contains(github.event.head_commit.message, '#patch') || 
      contains(github.event.head_commit.message, '#minor') || 
      contains(github.event.head_commit.message, '#major') || 
      contains(github.event.head_commit.message, '#alpha') || 
      contains(github.event.head_commit.message, '#final')
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_BUMP }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bumpver build twine

      - name: Determine Version Bump Level
        id: bump-level
        run: |
          MSG="${{ github.event.head_commit.message }}"
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          
          # 1. Handle Pre-releases (Allowed on ANY branch)
          if [[ "$MSG" == *'#alpha'* ]]; then
            if bumpver show | grep -q "alpha"; then
              echo "LEVEL=--tag-num" >> $GITHUB_ENV
            else
              echo "LEVEL=--patch --tag=alpha" >> $GITHUB_ENV
            fi
            
          # 2. SAFETY GUARD: Block stable releases on feature branches
          elif [[ "$BRANCH_NAME" != "main" ]]; then
            echo "🚨 Error: Stable releases (#patch, #minor, #major, #final) are ONLY allowed on the main branch!"
            exit 1
            
          # 3. Handle Stable Releases (Locked to main)
          elif [[ "$MSG" == *'#major'* ]]; then
            echo "LEVEL=--major" >> $GITHUB_ENV
            
          elif [[ "$MSG" == *'#minor'* ]]; then
            echo "LEVEL=--minor" >> $GITHUB_ENV
            
          elif [[ "$MSG" == *'#final'* ]]; then
            echo "LEVEL=--tag=final" >> $GITHUB_ENV
            
          else
            echo "LEVEL=--patch" >> $GITHUB_ENV
          fi

      - name: Bump Version
        run: |
          bumpver update $LEVEL

      - name: Commit and Push Version Bump
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: bump version [skip ci]"
          file_pattern: "pyproject.toml src/filedgr_pkg_utils/__init__.py"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Login to AWS CodeArtifact
        run: |
          aws codeartifact login --tool twine --repository filedgr-pkg-awsutils --domain filedgr --domain-owner 867912683733 --region eu-central-1

      - name: Build Package
        run: make package

      - name: Upload Package
        run: make upload-package