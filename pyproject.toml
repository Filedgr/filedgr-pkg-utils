[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "filedgr-pkg-utils"
# The version comes from the git tag (vX.Y.Z) via setuptools-scm; see [tool.setuptools_scm]
dynamic = ["version"]
requires-python = ">=3.11"
description = "A library of python based utils needed in the filedgr code stack"
readme = "README.md"
authors = [{ name = "Filedgr", email = "code@filedgr.com" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
keywords = ["filedgr", "pkg", "utils"]
# The base install has no third-party dependencies: hooks, resilience, caching,
# security, logging, filesystem (sync), evm hex helpers, sha256/sha512/blake2b
# hashing, HMAC signing and zip/gzip compression only need the standard library.
# Pick the extras for the features you use, or "all" for everything.
dependencies = []

[project.optional-dependencies]
# CanonicalJsonMixin / CanonicalJsonMixinV2
canonical = [
    "pydantic>=2.12.5, <3.0.0",
    "orjson>=3.11.5, <4.0.0",
    "rfc8785>=0.1.4, <0.2.0",
]
# Secp256k1Algorithm (OpenSSL-backed secp256k1)
crypto = [
    "cryptography>=49.0.0, <50.0.0",
]
# Keccak256Algorithm and Secp256k1EvmAlgorithm (replaces the former web3 dependency)
evm = [
    "eth-account>=0.13.6, <1.0.0",
    "eth-hash[pycryptodome]>=0.7.0, <1.0.0",
]
# ZstdAlgorithm and BrotliAlgorithm
compression = [
    "zstandard>=0.22.0, <1.0.0",
    "Brotli>=1.1.0, <2.0.0",
]
# async_atomic_write
async = [
    "aiofiles>=25.1.0, <26.0.0",
]
# Perceptual image hashing
images = [
    "ImageHash>=4.3.0, <5.0.0",
    "Pillow>=13.0.0, <14.0.0",
]
all = [
    "filedgr-pkg-utils[canonical,crypto,evm,compression,async,images]",
]
build = ["build", "twine"]
dev = ["black", "isort", "mypy", "pytest", "flake8"]

[project.urls]
repository = "https://github.com/Filedgr/filedgr-pkg-utils"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*"]

[tool.setuptools_scm]
# Releases are git tags created by .github/workflows/release.yml. A build of a
# tagged commit gets exactly that version; other builds get a dev version such
# as 0.9.1.dev3+g1a2b3c4. Without git metadata (e.g. a plain source archive)
# the fallback is used.
fallback_version = "0.0.0"

[tool.isort]
profile = "black"
import_heading_stdlib = "Standard library imports"
import_heading_thirdparty = "Third party imports"
import_heading_firstparty = "Reader imports"

[tool.pytest.ini_options]
pythonpath = [".", "src"]
asyncio_default_fixture_loop_scope = "function"
