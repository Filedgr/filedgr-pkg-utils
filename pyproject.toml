[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "filedgr-pkg-utils"
version = "0.3.4"
requires-python = ">=3.11"
description = "A library of python based utils needed in the filedgr code stack"
readme = "README.md"
authors = [{ name = "Filedgr", email = "code@filedgr.com" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
keywords = ["filedgr", "pkg", "utils"]
dependencies = [
    "pydantic>=2.12.5, <3.0.0",
    "ecdsa>=0.19.1, <1.0.0",
    "web3>=7.14.0, <8.0.0"]

[project.optional-dependencies]
build = ["build", "twine"]
dev = ["black", "bumpver", "isort", "mypy", "pytest", "flake8"]

[project.urls]
repository = "https://github.com/Filedgr/filedgr-pkg-utils"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*"]

[tool.bumpver]
current_version = "0.3.4"
version_pattern = "MAJOR.MINOR.PATCH[-PYTAGNUM]"
commit_message = "bump version {old_version} -> {new_version}"
commit = false
tag = false
push = false

[tool.bumpver.file_patterns]
"pyproject.toml" = [
    'version = "{version}"',
]
"src/filedgr_pkg_utils/__init__.py" = ["{version}"]

[tool.isort]
profile = "black"
import_heading_stdlib = "Standard library imports"
import_heading_thirdparty = "Third party imports"
import_heading_firstparty = "Reader imports"

[tool.pytest.ini_options]
pythonpath = [".", "src"]
